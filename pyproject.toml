[project]
name = "video-gen"
version = "0.1.0"
description = "CLI for generating videos with Google Veo on Vertex AI"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.30.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
pad = ["pillow>=10.0.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
video-gen = "video_gen:main"
video-gen-omni = "video_gen_omni:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["video_gen.py", "video_gen_omni.py", "_auth.py"]
